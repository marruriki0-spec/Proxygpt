<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RIKI — Profile & Shop</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(0, 162, 255, 0.12),
                    transparent 35%
                ),
                #08090b;

            color: #fff;
            padding: 14px 0;
            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;

            width: 380px;
            height: 380px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background: rgba(0, 162, 255, 0.035);

            filter: blur(90px);

            border-radius: 50%;

            animation: backgroundFloat 8s ease-in-out infinite;

            pointer-events: none;
        }

        @keyframes backgroundFloat {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -48%) scale(1.1);
            }
        }

        /* =========================
           CARD
        ========================== */

        .card {
            position: relative;

            width: calc(100% - 28px);
            max-width: 410px;

            padding: 27px 20px 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.075),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 25px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 25px 65px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.08);

            text-align: center;

            overflow: hidden;

            animation:
                cardEnter
                0.75s
                cubic-bezier(.22,1,.36,1)
                both;
        }

        @keyframes cardEnter {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card::before {
            content: "";

            position: absolute;

            width: 230px;
            height: 100px;

            top: -75px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(0,162,255,0.20);

            filter: blur(50px);

            pointer-events: none;

            animation: topGlow 5s ease-in-out infinite;
        }

        @keyframes topGlow {
            0%, 100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================
           PROFILE
        ========================== */

        .profile-frame {
            position: relative;

            width: 106px;
            height: 106px;

            margin: 0 auto 10px;

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;

            animation:
                profileEnter
                0.7s
                0.3s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        .profile-ring {
            position: absolute;

            inset: 0;

            border-radius: 50%;

            background:
                conic-gradient(
                    from 0deg,
                    transparent 0deg,
                    transparent 45deg,
                    rgba(0,162,255,0.85) 90deg,
                    rgba(255,255,255,0.25) 135deg,
                    transparent 180deg,
                    transparent 360deg
                );

            -webkit-mask:
                radial-gradient(
                    farthest-side,
                    transparent calc(100% - 2px),
                    #000 calc(100% - 1px)
                );

            mask:
                radial-gradient(
                    farthest-side,
                    transparent calc(100% - 2px),
                    #000 calc(100% - 1px)
                );

            animation:
                profileRingRotate
                5s
                linear
                infinite;
        }

        @keyframes profileRingRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .profile-frame::before {
            content: "";

            position: absolute;

            inset: 2px;

            border-radius: 50%;

            box-shadow:
                0 0 18px rgba(0,162,255,0.10);

            pointer-events: none;
        }

        .profile-img {
            position: relative;
            z-index: 2;

            width: 92px;
            height: 92px;

            object-fit: cover;
            object-position: center;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.18);

            background: #08090b;

            box-shadow:
                0 0 0 4px rgba(8,9,11,0.95),
                0 10px 28px rgba(0,0,0,0.45);

            transition:
                transform 0.35s ease,
                box-shadow 0.35s ease;
        }

        .profile-frame:hover .profile-img {
            transform: scale(1.045);

            box-shadow:
                0 0 0 4px rgba(8,9,11,0.95),
                0 0 25px rgba(0,162,255,0.18),
                0 14px 32px rgba(0,0,0,0.5);
        }

        @keyframes profileEnter {
            0% {
                opacity: 0;
                transform: translateY(15px) scale(0.88);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           NAME
        ========================== */

        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #b9e9ff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            opacity: 0;

            animation:
                fadeUp
                0.6s
                0.5s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        /* =========================
           BADGE
        ========================== */

        .badge {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            padding: 6px 13px;

            border-radius: 999px;

            background: rgba(255,255,255,0.055);

            border: 1px solid rgba(255,255,255,0.10);

            color: #d8d8d8;

            font-size: 0.72rem;

            font-weight: 600;

            margin-bottom: 9px;

            opacity: 0;

            animation:
                fadeUp
                0.6s
                0.62s
                cubic-bezier(.22,1,.36,1)
                forwards;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }

        .badge i {
            color: #00a2ff;

            transition:
                transform 0.3s ease;
        }

        .badge:hover {
            background: rgba(255,255,255,0.075);
            border-color: rgba(255,255,255,0.16);
            transform: translateY(-2px);
        }

        .badge:hover i {
            transform: rotate(-8deg) scale(1.08);
        }

        /* =========================
           DESCRIPTION
        ========================== */

        .description {
            font-size: 0.78rem;

            line-height: 1.5;

            color: #a7a7a7;

            max-width: 290px;

            margin: 0 auto 16px;

            opacity: 0;

            animation:
                fadeUp
                0.6s
                0.72s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        .description-gif {
            width: 28px;
            height: 28px;

            object-fit: contain;

            vertical-align: middle;

            margin-left: 4px;

            border-radius: 6px;

            transition:
                transform 0.25s ease;
        }

        .description-gif:hover {
            transform: scale(1.12) rotate(-3deg);
        }

        /* =========================
           SHOP
        ========================== */

        .shop-section {
            position: relative;

            margin-bottom: 17px;

            opacity: 0;

            animation:
                fadeUp
                0.65s
                0.82s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        .shop-label {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 7px;

            margin-bottom: 7px;

            color: #777;

            font-size: 0.61rem;

            font-weight: 700;

            letter-spacing: 1.8px;

            text-transform: uppercase;
        }

        .shop-label::before,
        .shop-label::after {
            content: "";

            width: 28px;
            height: 1px;

            background: rgba(255,255,255,0.12);

            transition:
                width 0.4s ease,
                background 0.4s ease;
        }

        .shop-section:hover .shop-label::before,
        .shop-section:hover .shop-label::after {
            width: 40px;

            background: rgba(0,162,255,0.3);
        }

        /* =========================
           SHOP IMAGE
        ========================== */

        .shop-banner-link {
            display: block;

            position: relative;

            text-decoration: none;

            cursor: pointer;

            border-radius: 15px;
        }

        .shop-banner-link img {
            display: block;

            width: 100%;

            max-width: 250px;

            height: auto;

            margin: 0 auto;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,0.12);

            box-shadow:
                0 9px 26px rgba(0,0,0,0.35);

            transition:
                transform 0.35s cubic-bezier(.22,1,.36,1),
                box-shadow 0.35s ease,
                filter 0.35s ease;
        }

        .shop-banner-link:hover img {
            transform:
                translateY(-4px)
                scale(1.025);

            box-shadow:
                0 15px 35px rgba(0,162,255,0.18),
                0 7px 20px rgba(0,0,0,0.5);

            filter: brightness(1.07);
        }

        .shop-banner-link:active img {
            transform:
                translateY(-1px)
                scale(0.97);
        }

        /* =========================
           SOCIAL
        ========================== */

        .social-title {
            font-size: 0.59rem;

            font-weight: 600;

            letter-spacing: 1.7px;

            color: #666;

            margin-bottom: 8px;

            opacity: 0;

            animation:
                fadeUp
                0.6s
                0.95s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        .social-icons {
            display: flex;

            justify-content: center;

            gap: 9px;

            opacity: 0;

            animation:
                fadeUp
                0.65s
                1.05s
                cubic-bezier(.22,1,.36,1)
                forwards;
        }

        .social-icons a {
            width: 42px;
            height: 42px;

            border-radius: 13px;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 1.1rem;

            color: #fff;

            text-decoration: none;

            background: rgba(255,255,255,0.045);

            border: 1px solid rgba(255,255,255,0.08);

            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.04);

            transition:
                transform 0.25s cubic-bezier(.22,1,.36,1),
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .social-icons a:hover {
            transform:
                translateY(-4px)
                scale(1.04);

            background: rgba(255,255,255,0.09);

            border-color: rgba(255,255,255,0.18);

            box-shadow:
                0 9px 20px rgba(0,0,0,0.3);
        }

        .social-icons a:active {
            transform: scale(0.93);
        }

        .discord:hover {
            color: #5865F2;
        }

        .instagram:hover {
            color: #e1306c;
        }

        .line:hover {
            color: #00b900;
        }

        .tiktok:hover {
            color: #ffffff;
        }

        /* =========================
           ANIMATION
        ========================== */

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(13px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           SMALL PHONES
        ========================== */

        @media (max-height: 700px) {

            .card {
                padding-top: 21px;
                padding-bottom: 17px;
            }

            .profile-frame {
                width: 96px;
                height: 96px;
                margin-bottom: 7px;
            }

            .profile-img {
                width: 82px;
                height: 82px;
            }

            h1 {
                font-size: 1.6rem;
                margin-bottom: 6px;
            }

            .badge {
                margin-bottom: 7px;
            }

            .description {
                margin-bottom: 12px;
            }

            .description-gif {
                width: 25px;
                height: 25px;
            }

            .shop-section {
                margin-bottom: 13px;
            }

            .shop-label {
                margin-bottom: 5px;
            }

            .shop-banner-link img {
                max-width: 225px;
            }

            .social-title {
                margin-bottom: 6px;
            }

            .social-icons a {
                width: 39px;
                height: 39px;
                border-radius: 12px;
            }
        }

        /* =========================
           VERY SMALL PHONES
        ========================== */

        @media (max-height: 620px) {

            .card {
                padding-top: 16px;
                padding-bottom: 13px;
            }

            .profile-frame {
                width: 88px;
                height: 88px;
                margin-bottom: 5px;
            }

            .profile-img {
                width: 75px;
                height: 75px;
            }

            h1 {
                font-size: 1.45rem;
                margin-bottom: 4px;
            }

            .badge {
                padding: 5px 11px;
                font-size: 0.67rem;
                margin-bottom: 5px;
            }

            .description {
                font-size: 0.73rem;
                margin-bottom: 9px;
            }

            .description-gif {
                width: 23px;
                height: 23px;
            }

            .shop-section {
                margin-bottom: 9px;
            }

            .shop-banner-link img {
                max-width: 205px;
            }

            .social-title {
                margin-bottom: 5px;
            }

            .social-icons {
                gap: 7px;
            }

            .social-icons a {
                width: 36px;
                height: 36px;
                font-size: 0.95rem;
                border-radius: 11px;
            }
        }

        /* =========================
           REDUCE MOTION
        ========================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>
